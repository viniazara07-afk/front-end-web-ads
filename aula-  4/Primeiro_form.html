```html
<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Loja de Videogames</title>
  </head>

  <body>

    <header>
      <h1>Loja de Videogames</h1>
    </header>

    <main>
      <section>
        <h2>Compra de Videogame</h2>

        <form action="https://postman-echo.com/post" method="post">

          <p>Preencha os dados para realizar sua compra.</p>

          <fieldset>
            <legend>Dados do cliente</legend>

            <div>
              <label for="nome_id">Nome:</label>
              <input id="nome_id" name="nome" type="text" required />
            </div>

            <div>
              <label for="email_id">E-mail:</label>
              <input id="email_id" name="email" type="email" required />
            </div>

            <div>
              <label for="telefone_id">Telefone:</label>
              <input id="telefone_id" name="telefone" type="tel" />
            </div>

          </fieldset>

          <fieldset>
            <legend>Videogame</legend>

            <div>
              <label for="console_id">Escolha o videogame:</label>

              <select id="console_id" name="console">
                <option value="ps5">PlayStation 5</option>
                <option value="xbox">Xbox Series X</option>
                <option value="switch">Nintendo Switch</option>
              </select>
            </div>

            <div>
              <label for="quantidade_id">Quantidade:</label>
              <input id="quantidade_id" name="quantidade" type="number" min="1" />
            </div>

            <div>
              <input id="controle_id" name="acessorio" type="checkbox" />
              <label for="controle_id">Controle extra</label>
            </div>

            <div>
              <input id="headset_id" name="acessorio" type="checkbox" />
              <label for="headset_id">Headset Gamer</label>
            </div>

          </fieldset>

          <fieldset>
            <legend>Endereço</legend>

            <div>
              <label for="cidade_id">Cidade:</label>
              <input id="cidade_id" name="cidade" type="text" />
            </div>

            <div>
              <label for="endereco_id">Endereço:</label>
              <input id="endereco_id" name="endereco" type="text" />
            </div>

          </fieldset>

          <fieldset>
            <legend>Pagamento</legend>

            <div>
              <label for="pagamento_id">Forma de pagamento:</label>

              <select id="pagamento_id" name="pagamento">
                <option value="pix">PIX</option>
                <option value="credito">Cartão de crédito</option>
                <option value="debito">Cartão de débito</option>
              </select>
            </div>

            <div>
              <label for="observacoes_id">Observações:</label>

              <textarea
                id="observacoes_id"
                name="observacoes"
                rows="4"
                cols="40"
              ></textarea>
            </div>

          </fieldset>

          <div>
            <button type="reset">Limpar</button>
            <button type="submit">Enviar pedido</button>
          </div>

        </form>
      </section>
    </main>

    <footer>
      <p>&copy; 2026 Loja de Videogames</p>
    </footer>

  </body>
</html>
```
