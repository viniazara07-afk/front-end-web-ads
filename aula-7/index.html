<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles/global.css">
    <script src="scripts/index.js" defer></script>
    <title>Formulario JS</title>
</head>
<body>
    <header>
        <h1>Formulario super simples</h1>
    </header>
    <main>
        <h2>Cadastro</h2>
        <form 
        id="Cadastro">
        <label for="nome">Nome*</label>
        <input type="text" id="nome">
        <span id="erro-nome" class="oculto"></span>

        
        <label for="idade">idade*</label>
        <input type="text" id="idade">
        <span id="erro-idade" class="oculto"></span>

        
        <label for="email">email*</label>
        <input type="text" id="email">
        <span id="erro-email" class="oculto"></span>

        <label>
            <input type="checkbox" id="termos">
            Li e aceito os termos
            <span id="erro-termos" class="oculto"></span>
        </label>
        <button onclick ="executar(event)">Enviar</button>
        <p id="concluido" class="oculto"></p>
    </form>
    </main>
    <footer>
        <p>Projeto para conhecermos o javaScript</p>
    </footer>
</body>
</html>
